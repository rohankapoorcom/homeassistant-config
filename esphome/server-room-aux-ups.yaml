---
substitutions:
  device_name: server-room-aux-ups
  friendly_name: Server Room Aux UPS

  api_encryption_key: !secret api_encryption_key
  ota_password: !secret ota_password
  ethernet_domain: !secret wifi_domain

packages:
  base: !include packages/base.yaml
  seedstudio-xiao-w5500: !include packages/seedstudio-xiao-w5500.yaml
  network-ups: !include packages/network-ups.yaml
  network-ups-tripplite: !include packages/network-ups-tripplite.yaml
  bluetooth_proxy: !include packages/bluetooth_proxy.yaml

sensor:
  # This SMART1500LCD (09AE:2009) does not report these. Other Tripp Lite models do.
  - id: !remove output_voltage
  - id: !remove load_percentage

output:
  - platform: template
    id: bluetooth_led
    type: binary
    write_action:
      - lambda: |-
          if (state) {
            id(user_led).turn_on();
          } else {
            id(user_led).turn_off();
          }