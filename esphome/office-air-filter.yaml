substitutions:
  device_name: office-air-filter
  friendly_name: Office Air Filter
  rx_pin: GPIO16
  tx_pin: GPIO17

  api_encryption_key: !secret api_encryption_key
  ota_password: !secret ota_password
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  wifi_domain: !secret wifi_domain

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_FREERTOS_UNICORE: y
  
packages:
  base: !include packages/base.yaml
  wifi: !include packages/wifi.yaml

external_components:
  - source:
      type: git
      url: https://github.com/tuct/levoit
      ref: main
    components: [levoit]

wifi:
  output_power: 15dB

uart:
  - id: uart_mcu2esp
    tx_pin:
      number: ${tx_pin}
      inverted: false
    rx_pin:
      number: ${rx_pin}
      inverted: false
    baud_rate: 115200

levoit:
  id: levoitcore300
  model: CORE300S

fan:
  - platform: levoit
    levoit: levoitcore300
    name: "Fan"
    id: levoit_fan1

switch:
  - platform: levoit
    levoit: levoitcore300
    name: "Display"
    type: display
  - platform: levoit
    levoit: levoitcore300
    name: "Child Lock"
    type: child_lock

number:
  - platform: levoit
    levoit: levoitcore300
    name: "Timer (min)"
    type: timer
  - platform: levoit
    levoit: levoitcore300
    name: "Auto Mode Room Size"
    type: efficiency_room_size
  - platform: levoit
    levoit: levoitcore300
    name: "Auto Mode Room Size Preset"
    type: auto_profile_room_size_input
    min_value: 9
    max_value: 50
  - platform: levoit
    levoit: levoitcore300
    name: "Filter Months"
    type: filter_lifetime_months

sensor:
  - platform: levoit
    levoit: levoitcore300
    name: "Air Quality PM2.5"
    type: pm25
  # MCU level 1-4. Not a US AQI; clear device_class so Home Assistant
  # does not color it with the EPA scale. Words are published below.
  - platform: levoit
    levoit: levoitcore300
    name: "Air Quality Level"
    id: office_air_quality_level
    type: aqi
    device_class: ""
    icon: mdi:gauge
    accuracy_decimals: 0
    on_value:
      then:
        - text_sensor.template.publish:
            id: office_air_quality
            state: !lambda |-
              switch (static_cast<int>(x)) {
                case 1: return std::string("excellent");
                case 2: return std::string("good");
                case 3: return std::string("moderate");
                case 4: return std::string("poor");
                default: return std::string("unknown");
              }
  - platform: levoit
    levoit: levoitcore300
    name: "Current CADR"
    type: current_cadr
  - platform: levoit
    levoit: levoitcore300
    name: "Filter %"
    type: filter_life_left

select:
  - platform: levoit
    levoit: levoitcore300
    name: "Fan Operating Mode"
    type: fan_operating_mode
  - platform: levoit
    levoit: levoitcore300
    name: "Auto Mode"
    type: auto_mode

text_sensor:
  # VeSync AirQualityLevel names: excellent, good, moderate, poor.
  # "bad" is an alias of poor in pyvesync, so the state is "poor".
  - platform: template
    name: "Air Quality"
    id: office_air_quality
    icon: mdi:air-filter
    update_interval: never
  - platform: levoit
    levoit: levoitcore300
    name: "MCU Version"
    type: mcu_version
  - platform: levoit
    levoit: levoitcore300
    name: "ESP Version"
    type: esp_version
  - platform: levoit
    levoit: levoitcore300
    name: "Timer Duration"
    type: timer_duration_initial
  - platform: levoit
    levoit: levoitcore300
    name: "Timer Remaining"
    type: timer_duration_remaining
  - platform: levoit
    levoit: levoitcore300
    name: "Error"
    type: error_message

button:
  - platform: levoit
    levoit: levoitcore300
    name: "Filter Reset"
    type: reset_filter_stats

binary_sensor:
  - platform: levoit
    levoit: levoitcore300
    name: "Filter Low"
    type: filter_low